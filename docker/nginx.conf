user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 4096m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Tell PHP/Laravel when a request is secure because TLS was terminated upstream.
    map $scheme $fastcgi_https {
        https on;
        default off;
    }

    server {
        listen 1337 default_server;
        server_name _;

        root /app/public;
        index index.php;
        charset utf-8;

        # Reverb WebSocket - the browser connects to ws(s)://<host>/app on the same origin.
        location /app {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
        }

        # Remote-agent hub - probes connect to ws(s)://<host>/agent with a Bearer token.
        location /agent {
            proxy_pass http://127.0.0.1:9091;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
        }

        location /build/ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
